name: Olist Pipeline CI

on:
  push:
  pull_request:

jobs:
  validate-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyspark delta-spark apache-airflow

      - name: Validate Python syntax
        run: |
          python -m py_compile main.py
          python -m py_compile ingestion/bronze_loader.py
          python -m py_compile transformation/silver_cleaner.py
          python -m py_compile transformation/gold_features.py
          python -m py_compile serving/analytics.py
          python -m py_compile utils/config.py
          python -m py_compile utils/spark_session.py
          python -m py_compile dags/olist_pipeline_dag.py
